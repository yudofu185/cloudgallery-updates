# app-version.json を push・プルリクエストのたびに検査する。
# 形式が壊れた更新情報が GitHub Pages で公開されるのを防ぐ（失敗したら直してから push し直す）。
name: validate app-version.json

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs app-version.json
