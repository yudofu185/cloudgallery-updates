# app-version.json を push・プルリクエストのたびに検査する。
# 形式が壊れた更新情報が GitHub Pages で公開されるのを防ぐ（失敗したら直してから push し直す）。
name: validate app-version.json

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v4 は廃止予定の Node.js 20 で動くため、Node.js 24 で動く v6 を使う
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # Node.js 20 は 2026-04-30 でサポート終了。現在の LTS の 24 で検査する
          node-version: 24
      - run: node scripts/validate.mjs app-version.json
